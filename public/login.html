<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a32"><meta name="robots" content="noindex,nofollow"><title>Sign in to CareerOS</title><link rel="stylesheet" href="/styles.css"></head><body class="login-page"><a class="login-back" href="/">← Back to CareerOS</a><main class="login-card"><a class="brand login-brand" href="/"><span class="brand-symbol">C<span>✦</span></span><span>Career<span class="brand-os">OS</span></span></a><div class="eyebrow">YOUR NEXT CHAPTER STARTS HERE</div><h1 id="loginHeading">Welcome back.</h1><p id="loginIntro">Sign in securely with a one-time code sent to your email.</p><form id="loginForm"><label for="loginEmail">Email address</label><input id="loginEmail" type="email" required autocomplete="username webauthn" placeholder="you@example.com"><div id="codeField" class="hidden"><label for="loginCode">Six-digit code</label><input id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><button type="submit" id="loginSubmit" class="btn btn-primary btn-full">Continue with email <span>↗</span></button><button type="button" id="loginBackBtn" class="btn btn-secondary btn-full hidden">Use another email</button></form><div id="passkeyOffer" class="passkey-box hidden"><p>Add a passkey to sign in with your device lock or biometrics next time.</p><button type="button" id="addPasskey" class="btn btn-primary btn-full">Add a passkey</button><button type="button" id="skipPasskey" class="btn btn-secondary btn-full">Not now</button></div><p id="loginStatus" class="login-status" role="status"></p><p class="login-legal">By continuing, you acknowledge the <a href="/privacy.html">Privacy Policy</a> and agree to the <a href="/terms.html">Terms of Service</a>.</p></main><script>
(function(){const $=id=>document.getElementById(id);const A=window.hatchable.auth;if(!A){$('loginStatus').textContent='Sign-in service unavailable. Please retry shortly.';return}let step='email',hasPasskey=false;function status(t,err){$('loginStatus').textContent=t;$('loginStatus').className='login-status'+(err?' error':'')}function next(){let n=new URLSearchParams(location.search).get('next')||'/';if(!n.startsWith('/')||n.startsWith('//')||n.includes('\\')||/[\u0000-\u001f\u007f]/.test(n))n='/';location.replace(n)}A.getSession().then(s=>{if(s&&s.user)next()}).catch(()=>{});$('loginForm').onsubmit=async e=>{e.preventDefault();const button=$('loginSubmit');button.disabled=true;try{if(step==='email'){const email=$('loginEmail').value.trim(),r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const d=await A.signInWithPasskey({email});if(d&&d.user){next();return}}catch(e){}}step='code';$('loginEmail').readOnly=true;$('codeField').classList.remove('hidden');$('loginBackBtn').classList.remove('hidden');$('loginHeading').textContent='Check your inbox.';$('loginIntro').textContent='Enter the code sent to '+email+'.';status('Code sent.')}else{const d=await A.verifyCode({email:$('loginEmail').value.trim(),code:$('loginCode').value.trim()});if(!d||!d.user)throw Error('The code was not accepted.');if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('careeros-passkey-declined')!=='1'){$('loginForm').classList.add('hidden');$('passkeyOffer').classList.remove('hidden');$('loginHeading').textContent='You’re signed in.';$('loginIntro').textContent='Make your next sign-in faster.'}else next()}}catch(err){status(err.message||'Could not sign in. Please try again.',true)}finally{button.disabled=false}};$('loginBackBtn').onclick=()=>{step='email';$('loginEmail').readOnly=false;$('codeField').classList.add('hidden');$('loginBackBtn').classList.add('hidden');$('loginHeading').textContent='Welcome back.';$('loginIntro').textContent='Sign in securely with a one-time code sent to your email.';status('')};$('addPasskey').onclick=async()=>{try{await A.registerPasskey({name:'CareerOS device'});next()}catch(e){localStorage.setItem('careeros-passkey-declined','1');status(e.message||'Could not add a passkey. You can continue.',true)}};$('skipPasskey').onclick=()=>{localStorage.setItem('careeros-passkey-declined','1');next()}})();
</script></body></html>
