[auth]
enabled = true
providers = ["email"]

[ai]
required = true
description = "CareerOS AI career coaching, roadmap drafting, resume analysis, job description skill-gap analysis, and interview feedback. Configure an approved AI provider securely in project setup."

[[config]]
name = "free_monthly_ai_limit"
type = "number"
label = "Free plan monthly AI limit"
help = "Monthly CareerOS AI actions per user. This is enforced server-side."
default = 20
min = 0
max = 1000
integer = true

[[config]]
name = "pro_monthly_ai_limit"
type = "number"
label = "Pro plan monthly AI limit"
help = "Monthly CareerOS AI actions per Pro subscriber."
default = 300
min = 0
max = 10000
integer = true

[[config]]
name = "pro_monthly_price_inr"
type = "number"
label = "Pro monthly price INR"
help = "Displayed as a proposed plan price only until a payment gateway is connected."
default = 799
min = 0
max = 100000
integer = true